<!doctype html>
<!-- Loaded by scripts/make-cover-stills.mjs, never by the site: renders a cover's
     still with the app's own renderer (src/covers/coverRenderer.ts or
     cachedCoverRenderer.ts for a shader, src/covers/rive/riveCover.ts for a
     Rive cover). -->
<html lang="en"><head><meta charset="utf-8" /><title>cover still</title></head>
<body style="margin:0;background:transparent">
<script type="module">
import { WebGLRenderer } from 'three';
import { COVERS } from '/src/covers/covers.ts';
import { coverCropOf } from '/src/covers/coverRenderer.ts';
import { makeCoverRenderer } from '/src/covers/cachedCoverRenderer.ts';
import { dialDefaults } from '/src/covers/dialValues.ts';
import { ensureRive, rivePlayer, riveProbe } from '/src/covers/rive/riveCover.ts';

/** A Rive cover's still: its GRID artboard (Main) as its first frame — at rest,
 *  no pointer — the whole frame at `width` px. A 2D canvas already reads back
 *  straight-alpha RGBA, top row first. */
async function riveStill(id, width) {
  const def = COVERS[id];
  const w = width;
  const h = Math.round((width * def.frame.h) / def.frame.w);
  ensureRive(id);
  let p = null;
  for (let i = 0; i < 400 && !(p = rivePlayer(id, 'grid')); i++) {
    if (riveProbe().failed(id)) throw new Error(`${id}: the Rive cover failed to load`);
    await new Promise((r) => setTimeout(r, 25));
  }
  if (!p) throw new Error('the Rive cover never became ready');
  p.draw(0, w, h);
  return p.canvas.getContext('2d').getImageData(0, 0, w, h).data;
}

/** The whole frame at `width` px, t = 0, dome at rest, nothing behind it,
 *  with the cover's still dials (`stillValues`: card 03's light parked on its
 *  logo): straight-alpha RGBA, top row first, base64. */
window.renderStill = async (id, width) => {
  const def = COVERS[id];
  if (def.kind === 'rive') {
    const out = await riveStill(id, width);
    const h = Math.round((width * def.frame.h) / def.frame.w);
    let bin = '';
    for (let i = 0; i < out.length; i += 0x8000) bin += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
    return { w: width, h, b64: btoa(bin) };
  }
  const w = width;
  const h = Math.round((width * def.frame.h) / def.frame.w);
  const canvas = document.createElement('canvas');
  const gl = new WebGLRenderer({ canvas, alpha: true, premultipliedAlpha: true, antialias: false, preserveDrawingBuffer: true });
  gl.setPixelRatio(1);
  gl.setSize(w, h, false);
  const values = dialDefaults(def.dials);
  const cover = makeCoverRenderer(gl, def, def.stillValues ? def.stillValues(values) : values);
  for (let i = 0; i < 400 && !cover.ready(); i++) await new Promise((r) => setTimeout(r, 25));
  if (!cover.ready()) throw new Error('cover never became ready');
  const crop = coverCropOf(def.frame.w, def.frame.h, w, h, { x0: 0, y0: 0, w: 1, h: 1 });
  cover.draw(null, { t: 0, crop, pxW: w, pxH: h, dome: { x: 0, y: 0, amp: 0 }, backdrop: null });
  const ctx = gl.getContext();
  const px = new Uint8Array(w * h * 4);
  ctx.readPixels(0, 0, w, h, ctx.RGBA, ctx.UNSIGNED_BYTE, px);
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = ((h - 1 - y) * w + x) * 4, j = (y * w + x) * 4, a = px[i + 3];
    for (let k = 0; k < 3; k++) out[j + k] = a ? Math.min(255, Math.round((px[i + k] * 255) / a)) : 0;
    out[j + 3] = a;
  }
  let bin = '';
  for (let i = 0; i < out.length; i += 0x8000) bin += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
  return { w, h, b64: btoa(bin) };
};
window.stillReady = true;
</script>
</body></html>
